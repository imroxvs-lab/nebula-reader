    <circle cx="790" cy="214" r="7" opacity="0.8"/>
    <circle cx="820" cy="760" r="8" opacity="0.7"/>
    <circle cx="214" cy="790" r="6" opacity="0.6"/>
    <circle cx="660" cy="140" r="5" opacity="0.6"/>
  </g>
  <g transform="rotate(-24 512 512)">
    <ellipse cx="512" cy="512" rx="400" ry="132" fill="none" stroke="url(#ring)" stroke-width="44" opacity="0.55"/>
  </g>
  <circle cx="512" cy="512" r="248" fill="url(#planet)"/>
  <g transform="rotate(-24 512 512)" clip-path="url(#front)">
