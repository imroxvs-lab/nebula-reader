[package]
name = "nebula-reader"
description = "Nebula Reader: lector de libros y cómics electrónicos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# El sufijo `_lib` evita el conflicto de nombres entre lib y bin en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "nebula_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nebula-core = { path = "../crates/nebula-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
