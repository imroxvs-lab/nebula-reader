[workspace]
resolver = "2"
members = ["crates/nebula-core", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Nebula Reader contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Selección de lints pedantic útiles sin el ruido del grupo completo.
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Optimizado para tamaño y bajo consumo; se medirá frente a opt-level = 3 en la fase 7.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
