[package]
name = "nebula-core"
description = "Núcleo de Nebula Reader: dominio, formatos y biblioteca, sin dependencias de Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_latest", "thread_safe", "image_latest"], optional = true }
quick-xml = "0.42.0"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
thiserror = "2.0.21"
tracing = "0.1.44"
unrar = "0.5.8"
walkdir = "2.5.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["compress"] }
tempfile = "3.27.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[features]
# Lectura de PDF con PDFium (requiere pdfium.dll en tiempo de ejecución).
pdf = ["dep:pdfium-render"]
