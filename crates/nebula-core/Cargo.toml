[package]
name = "nebula-core"
description = "Núcleo de Nebula Reader: dominio, formatos y biblioteca, sin dependencias de Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
